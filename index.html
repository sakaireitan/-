<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行動記録アプリ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f6; margin: 0; padding: 10px; color: #333; max-width: 500px; margin: 0 auto; }
        .form-container { background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .form-header h2 { margin: 0; font-size: 16px; color: #2c3e50; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 12px; color: #555; }
        .time-inputs { display: flex; align-items: center; gap: 8px; }
        input[type="time"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background-color: #fafafa; }
        button.submit-btn { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        button.submit-btn:active { background-color: #2980b9; }
        .week-nav { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 15px; padding-bottom: 5px; scrollbar-width: none; }
        .week-nav::-webkit-scrollbar { display: none; }
        .date-btn { flex-shrink: 0; padding: 8px 12px; border-radius: 20px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: bold; cursor: pointer; color: #555; }
        .date-btn.active { background: #3498db; color: #fff; border-color: #3498db; }
        .timeline-wrapper { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 50vh; min-height: 400px; overflow-y: auto; position: relative; }
        .timeline-container { position: relative; height: 1440px; background: #fff; }
        .time-grid-row { height: 60px; border-bottom: 1px solid #f0f0f0; display: flex; box-sizing: border-box; }
        .time-label { width: 50px; text-align: right; padding-right: 8px; color: #95a5a6; font-size: 11px; font-weight: bold; border-right: 1px solid #f0f0f0; background-color: #fbfcfc; transform: translateY(-6px); }
        .task-layer { position: absolute; top: 0; left: 50px; right: 0; bottom: 0; pointer-events: none; }
        .task-block { position: absolute; border-radius: 6px; padding: 4px 8px; font-size: 12px; line-height: 1.3; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.15); border-left-width: 4px; border-left-style: solid; pointer-events: auto; transition: all 0.2s ease; }
        .task-time { font-size: 10px; font-weight: bold; opacity: 0.8; margin-bottom: 2px; }
        .task-title { font-weight: bold; word-break: break-all; }
        .delete-btn { position: absolute; top: 2px; right: 4px; cursor: pointer; font-weight: bold; padding: 2px 5px; font-size: 14px; opacity: 0.7; background: rgba(255,255,255,0.3); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>行動を記録</h2>
        </div>
        
        <div class="form-group">
            <label>時間（開始 〜 終了）</label>
            <div class="time-inputs">
                <input type="time" id="startTime" required>
                <span>〜</span>
                <input type="time" id="endTime" required>
            </div>
        </div>

        <div class="form-group">
            <label>内容</label>
            <input type="text" id="taskDesc" placeholder="例：読書、散歩など" required>
        </div>

        <button class="submit-btn" id="addBtn">記録する</button>
    </div>

    <div class="week-nav" id="weekNav"></div>

    <div class="timeline-wrapper" id="timelineWrapper">
        <div class="timeline-container" id="timeline">
            <div id="gridBg"></div>
            <div id="taskLayer" class="task-layer"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Firebaseの設定情報を統合
        const firebaseConfig = {
          apiKey: "AIzaSyCht7krUKFIofiUXp04rArEQ18XBwJ7TUQ",
          authDomain: "actionlogger-53475.firebaseapp.com",
          projectId: "actionlogger-53475",
          storageBucket: "actionlogger-53475.firebasestorage.app",
          messagingSenderId: "783737975042",
          appId: "1:783737975042:web:c46d30e41148d6dd83921b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const PIXELS_PER_MINUTE = 1;
        let currentDisplayDate = '';
        let weekDates = [];
        let unsubscribe = null; 

        initDates();
        renderWeekNav();
        createScheduleGrid();
        setDefaultTime();
        scrollToCurrentTime();
        loadRecordsFromCloud();

        function initDates() {
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                weekDates.push({ str: dateStr, label: i === 0 ? '今日' : `${d.getMonth() + 1}/${d.getDate()}` });
            }
            currentDisplayDate = weekDates[weekDates.length - 1].str;
        }

        function renderWeekNav() {
            const nav = document.getElementById('weekNav');
            nav.innerHTML = '';
            weekDates.forEach(dateObj => {
                const btn = document.createElement('button');
                btn.className = `date-btn ${dateObj.str === currentDisplayDate ? 'active' : ''}`;
                btn.innerText = dateObj.label;
                btn.onclick = () => {
                    currentDisplayDate = dateObj.str;
                    renderWeekNav();
                    loadRecordsFromCloud(); 
                };
                nav.appendChild(btn);
            });
            nav.scrollLeft = nav.scrollWidth;
        }

        function createScheduleGrid() {
            const bgContainer = document.getElementById('gridBg');
            for (let i = 0; i < 24; i++) {
                const row = document.createElement('div');
                row.className = 'time-grid-row';
                row.innerHTML = `<div class="time-label">${i === 0 ? '' : i + ':00'}</div>`;
                bgContainer.appendChild(row);
            }
        }

        function setDefaultTime() {
            const now = new Date();
            document.getElementById('startTime').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function scrollToCurrentTime() {
            const wrapper = document.getElementById('timelineWrapper');
            const now = new Date();
            if(wrapper) wrapper.scrollTop = Math.max(0, (now.getHours() * 60) - 60);
        }

        function timeToMinutes(timeStr) {
            const parts = timeStr.split(':');
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function getTaskColors(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return { bg: `hsl(${hue}, 85%, 92%)`, text: `hsl(${hue}, 70%, 25%)`, border: `hsl(${hue}, 70%, 55%)` };
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function loadRecordsFromCloud() {
            if (unsubscribe) unsubscribe();

            const q = query(collection(db, "records"), where("date", "==", currentDisplayDate));
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                let records = [];
                snapshot.forEach((doc) => {
                    records.push({ id: doc.id, ...doc.data() }); 
                });

                renderTasks(records);
            });
        }

        function renderTasks(records) {
            const taskLayer = document.getElementById('taskLayer');
            taskLayer.innerHTML = '';
            let placedBlocks = [];

            records.forEach(record => {
                const startMins = timeToMinutes(record.startTime);
                const endMins = timeToMinutes(record.endTime);
                const overlapping = placedBlocks.filter(b => startMins < b.endMins && endMins > b.startMins);
                
                let offset = 0;
                if (overlapping.length > 0) offset = Math.max(...overlapping.map(b => b.offset)) + 1;
                placedBlocks.push({ ...record, startMins, endMins, offset });
            });

            placedBlocks.forEach(block => {
                const top = block.startMins * PIXELS_PER_MINUTE;
                const height = (block.endMins - block.startMins) * PIXELS_PER_MINUTE;
                const leftShift = block.offset * 15;
                const zIndex = 10 + block.offset;
                const colors = getTaskColors(block.taskDesc);
                
                const item = document.createElement('div');
                item.className = 'task-block';
                item.style.top = `${top}px`;
                item.style.height = `${height}px`;
                item.style.left = `calc(5px + ${leftShift}px)`;
                item.style.width = `calc(100% - 10px - ${leftShift}px)`;
                item.style.zIndex = zIndex;
                item.style.backgroundColor = colors.bg;
                item.style.color = colors.text;
                item.style.borderLeftColor = colors.border;

                item.innerHTML = `
                    <div class="task-time">${block.startTime}〜${block.endTime}</div>
                    <div class="task-title">${escapeHtml(block.taskDesc)}</div>
                    <span class="delete-btn" style="color: ${colors.text};" data-id="${block.id}">✕</span>
                `;
                
                item.querySelector('.delete-btn').addEventListener('click', async (e) => {
                    const docId = e.target.getAttribute('data-id');
                    await deleteDoc(doc(db, "records", docId));
                });

                taskLayer.appendChild(item);
            });
        }

        document.getElementById('addBtn').addEventListener('click', async () => {
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const taskDesc = document.getElementById('taskDesc').value.trim();

            if (!startTime || !endTime || !taskDesc) {
                alert('すべての項目を入力してください。');
                return;
            }
            if (timeToMinutes(startTime) >= timeToMinutes(endTime)) {
                alert('終了時間は開始時間よりも後の時間を指定してください。');
                return;
            }

            try {
                await addDoc(collection(db, "records"), {
                    date: currentDisplayDate,
                    startTime: startTime,
                    endTime: endTime,
                    taskDesc: taskDesc
                });

                document.getElementById('startTime').value = endTime;
                document.getElementById('endTime').value = '';
                document.getElementById('taskDesc').value = '';

            } catch (e) {
                console.error("エラーが発生しました: ", e);
                alert("データの保存に失敗しました。");
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed', err));
            });
        }
    </script>
</body>
</html>
